<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Root owns the service name -->
  <policy user="root">
    <allow own="io.github.erhanzeyrek.WifiHotspot"/>
    <allow send_destination="io.github.erhanzeyrek.WifiHotspot"/>
    <allow receive_sender="io.github.erhanzeyrek.WifiHotspot"/>
  </policy>

  <!-- Allow members of group wheel and sudo to invoke methods -->
  <policy group="wheel">
    <allow send_destination="io.github.erhanzeyrek.WifiHotspot"/>
    <allow receive_sender="io.github.erhanzeyrek.WifiHotspot"/>
  </policy>

  <policy group="sudo">
    <allow send_destination="io.github.erhanzeyrek.WifiHotspot"/>
    <allow receive_sender="io.github.erhanzeyrek.WifiHotspot"/>
  </policy>

  <!-- Allow all logged in users to receive signals and query status -->
  <policy context="default">
    <allow send_destination="io.github.erhanzeyrek.WifiHotspot"/>
    <allow receive_sender="io.github.erhanzeyrek.WifiHotspot"/>
  </policy>
</busconfig>
