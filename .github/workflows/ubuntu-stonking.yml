name: Ubuntu Stonking package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      package_version:
        description: Base Debian version (leave empty to use the changelog)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stonking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Ubuntu 26.10
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      GTK_A11Y: none

    steps:
      - name: Install build and test tools
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git dpkg-dev python3 python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 nodejs gjs iptables \
            dbus xvfb xauth lintian appstream \
            gcc pkgconf libgtk-3-dev libjansson-dev

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run automated and real-widget checks
        run: |
          python3 -m unittest discover -s tests
          node tests/test_tray.mjs
          for script in extension/*.js; do
            node --input-type=module --check < "$script"
          done
          bash -n daemon/create_ap packaging/build-deb.sh
          sh -n packaging/debian/postinst packaging/debian/prerm \
            packaging/debian/postrm tests/check_package_lifecycle.sh
          dbus-run-session -- xvfb-run -a python3 tests/check_settings_window.py
          dbus-run-session -- xvfb-run -a python3 tests/check_desktop_tray.py
          dbus-run-session -- xvfb-run -a env SANITIZE=1 integration/nm-applet/test.sh
          appstreamcli validate --no-net data/io.github.erhanzeyrek.WifiHotspot.metainfo.xml

      - name: Build Stonking package
        id: package
        env:
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          base_version="${INPUT_VERSION:-$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)}"
          dpkg --validate-version "$base_version"
          version="${base_version}+ubuntu26.10.${GITHUB_RUN_NUMBER}"
          previous_version="${version}~ci.previous"
          ./packaging/build-deb.sh "$previous_version"
          ./packaging/build-deb.sh "$version"
          package="gnome-wifi-hotspot_${version}_all.deb"
          previous="gnome-wifi-hotspot_${previous_version}_all.deb"
          printf 'deb_path=dist/%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'previous_path=dist/%s\n' "$previous" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum "$package" > SHA256SUMS)
          lintian --tag-display-limit 0 "dist/$package"

      - name: Verify installation, upgrade, removal, and purge
        env:
          PREVIOUS_PATH: ${{ steps.package.outputs.previous_path }}
          PACKAGE_PATH: ${{ steps.package.outputs.deb_path }}
        run: |
          apt-get install -y --no-install-recommends "$GITHUB_WORKSPACE/$PREVIOUS_PATH"
          sh tests/check_package_lifecycle.sh "$GITHUB_WORKSPACE/$PACKAGE_PATH"
          dpkg --audit

      - name: Upload package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wifi-relay-ubuntu-stonking-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.deb_path }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
